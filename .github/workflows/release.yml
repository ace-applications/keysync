name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-vst3:
    # pinned: windows-latest moved to VS 2026; repo builds with the VS 2022
    # v143 toolset until the project decides to migrate toolsets
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Self-test
        run: ./build/Release/keysync_selftest.exe

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path "build/KeySyncFree_artefacts/Release/VST3/KeySync Free.vst3" -DestinationPath "KeySyncFree_VST3-win-x64.zip"
          Compress-Archive -Path "build/KeySyncPro_artefacts/Release/VST3/KeySync Pro.vst3" -DestinationPath "KeySyncPro_VST3-win-x64.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: keysync-windows-vst3
          path: '*.zip'

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            KeySyncFree_VST3-win-x64.zip
            KeySyncPro_VST3-win-x64.zip
